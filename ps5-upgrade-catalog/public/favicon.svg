<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="b" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0b1f6b"/>
    </linearGradient>
    <mask id="p">
      <g fill="#fff">
        <rect x="7.5" y="11.5" width="17" height="9" rx="4"/>
        <rect x="12.5" y="10.2" width="7" height="2.6" rx="1.3"/>
        <rect x="6.6" y="14.8" width="5.6" height="11.4" rx="2.8"
              transform="rotate(-18 9.4 20.5)"/>
        <rect x="19.8" y="14.8" width="5.6" height="11.4" rx="2.8"
              transform="rotate(18 22.6 20.5)"/>
      </g>
      <!-- At sixteen pixels the d-pad and the four buttons turn to mush, so
           the small mark keeps only the two sticks, which are what still
           reads as a controller once everything else has gone. -->
      <g fill="#000">
        <circle cx="12.3" cy="17.4" r="2"/>
        <circle cx="19.7" cy="17.4" r="2"/>
      </g>
    </mask>
  </defs>
  <rect width="32" height="32" rx="7" fill="url(#b)"/>
  <rect width="32" height="32" fill="#fff" mask="url(#p)"/>
</svg>
