# Netlify configuration — Whisper Studio
#
# Whisper runs in the visitor's browser (WebGPU via transformers.js) or on
# Groq. Netlify only ever serves static files plus two small functions, so
# this deploys on the free tier with no build step.

[build]
  publish   = "public"
  functions = "netlify/functions"
  # Dependency-free vanilla JS — nothing to bundle.
  command   = "echo 'static site — nothing to build'"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# /api/* routes come from each function's exported `config.path`.

[[redirects]]
  from   = "/*"
  to     = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"
    Permissions-Policy     = "microphone=(self)"

# ES modules must be served as JavaScript or the browser refuses them.
[[headers]]
  for = "/*.mjs"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

[[headers]]
  for = "/worker.js"
  [headers.values]
    Content-Type = "text/javascript; charset=utf-8"

# Model weights are large and immutable; let the browser keep them.
[[headers]]
  for = "/lib/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"
